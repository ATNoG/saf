id: workflow-bank
name: workflow-bank
version: '0.1.0'
specVersion: '0.8'
description: Banking App
start: entry-event

events:
  - name: triggerEvent
    type: http.request.received
    source: http-event-sources
    kind: consumed

functions:
  - name: login
    type: custom
    operation: knative:services.v1.serving.knative.dev/login?method=POST
    metadata:
      firewall:
        request:
          default-action: accept
          rules:
            # 1. Drop if method is not POST
            - action: drop
              expression: |
                  .REQUEST.METHOD
                  | ascii_upcase
                  | . != "POST"

            # 3. Drop if path is not exactly /
            - action: drop
              expression: |
                  .REQUEST.URI.path != "/"

            # 4. Drop if query string is present (login should not use query params)
            - action: drop
              expression: |
                .REQUEST.URI.query | length > 0

            # 5. Drop if Content-Type is not application/json
            - action: drop
              expression: |
                (
                  .REQUEST.HEADERS["Content-Type"] // []
                  | any(
                      ascii_downcase
                      | startswith("application/json")
                    )
                  | not
                )
            # 6. Drop if Authorization header is present (login should not have one)
            - action: drop
              expression: |
                  .REQUEST.HEADERS
                  | has("Authorization")

            # 1. Required fields must exist
            - action: drop
              expression: |
                (.REQUEST.BODY.username? | not) or (.REQUEST.BODY.password? | not)

            # 2. Username must be a safe string
            - action: drop
              expression: |
                  .REQUEST.BODY.username?
                  | (type != "string"
                    or length < 3
                    or length > 64
                    or test("^[a-zA-Z0-9._-]+$") | not)

            # 3. Password must be a string with sane size limits
            - action: drop
              expression: |
                .REQUEST.BODY.password?
                | (type != "string"
                or length < 8
                or length > 128)

            # 4. SQL injection detection (username is interpolated into query)
            - action: drop
              expression: |
                  .REQUEST.BODY.username?
                  | test("(?i)(union\\s+select|select\\s+.*from|or\\s+1=1|--|;|/\\*)")

            # 5. Template / code injection detection
            - action: drop
              expression: |
                  ([.REQUEST.BODY.username?, .REQUEST.BODY.password?] | map(tostring) | join(" ")) | test("{{|}}|{%-|-%}|__class__|__mro__|__subclasses__")

            # 6. Control characters / binary payloads
            - action: drop
              expression: |
                  ([.REQUEST.BODY.username?, .REQUEST.BODY.password?]
                  | map(tostring)
                  | join(""))
                  | test("[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F]")
            - action: drop
              expression: |
                  ([.REQUEST.BODY.username?]
                  | map(tostring)
                  | join(""))
                  | test("admin")
        response:
          default-action: accept
          rules:

            # 7. No stack traces or internal errors
            - action: drop
              expression: |
                  .RESPONSE.BODY.error?
                  | type == "string"
                  and test("(?i)(stacktrace|exception|traceback|sql|directus)")

            # 8. Password must never appear in response
            - action: drop
              expression: |
                  .RESPONSE.BODY.password? | not | not

            # 9. JWT must not be returned in the body
            - action: drop
              expression: |
                  .RESPONSE.BODY.token? or .jwt? or .access_token?
  - name: authorization
    type: custom
    operation: knative:services.v1.serving.knative.dev/authorization?method=POST
    metadata:
      firewall:
        request:
          default-action: accept
          rules:
            # 1. Drop if method is not POST
            - action: drop
              expression: |
                  .REQUEST.METHOD
                  | ascii_upcase
                  | . != "POST"

            # 2. Drop if path is not exactly /
            - action: drop
              expression: |
                  .REQUEST.URI.path != "/"

            # 3. Drop if query string is present
            - action: drop
              expression: |
                .REQUEST.URI.query | length > 0

            # 4. Drop if Content-Type is not application/json
            - action: drop
              expression: |
                (
                  .REQUEST.HEADERS["Content-Type"] // []
                  | any(
                      ascii_downcase
                      | startswith("application/json")
                    )
                  | not
                )

            # 5. Require Authorization header (must be present for auth)
            - action: drop
              expression: |
                  (.REQUEST.HEADERS
                  | has("Authorization")
                  | not)

            # 6. Authorization header must be Bearer token format
            - action: drop
              expression: |
                  (.REQUEST.HEADERS["Authorization"]
                  | test("^Bearer ")
                  | not)

            # 7. Token must be present and non-empty
            - action: drop
              expression: |
                  (.REQUEST.HEADERS["Authorization"]
                  | split(" ")
                  | .[1]
                  | length == 0)

            # 8. Control characters / binary payloads in token
            - action: drop
              expression: |
                  (.REQUEST.HEADERS["Authorization"]
                  | split(" ")
                  | .[1]
                  | test("[\x00-\x08\x0B\x0C\x0E-\x1F]"))

            # 9. SQL injection detection in token
            - action: drop
              expression: |
                  (.REQUEST.HEADERS["Authorization"]
                  | split(" ")
                  | .[1]
                  | test("(?i)(union\\s+select|select\\s+.*from|or\\s+1=1|--|;|/\\*)"))

            # 10. Template / code injection detection in token
            - action: drop
              expression: |
                  (.REQUEST.HEADERS["Authorization"]
                  | split(" ")
                  | .[1]
                  | test("{{|}}|{%-|-%}|__class__|__mro__|__subclasses__"))
        response:
          default-action: accept
          rules:
            # 1. No stack traces or internal errors
            - action: drop
              expression: |
                  .RESPONSE.BODY.error?
                  | type == "string"
                  and test("(?i)(stacktrace|exception|traceback|sql|directus)")

            # 2. JWT must not be returned in the body
            - action: drop
              expression: |
                  .RESPONSE.BODY.token? or .jwt? or .access_token?

            # 3. Password must never appear in response
            - action: drop
              expression: |
                  .RESPONSE.BODY.password? | not | not

            # 4. Validate response structure
            - action: drop
              expression: |
                  (.RESPONSE.BODY.message? | not) or (.RESPONSE.BODY.client? | not) or (.RESPONSE.BODY["do-verification"]? | not)
  - name: verify-transaction
    type: custom
    operation: knative:services.v1.serving.knative.dev/verify-transaction?method=POST
    metadata:
      firewall:
        request:
          default-action: accept
          rules:
            # 1. Drop if method is not POST
            - action: drop
              expression: |
                  .REQUEST.METHOD
                  | ascii_upcase
                  | . != "POST"

            # 2. Drop if path is not exactly /
            - action: drop
              expression: |
                  .REQUEST.URI.path != "/"

            # 3. Drop if query string is present
            - action: drop
              expression: |
                .REQUEST.URI.query | length > 0

            # 4. Drop if Content-Type is not application/json
            - action: drop
              expression: |
                (
                  .REQUEST.HEADERS["Content-Type"] // []
                  | any(
                      ascii_downcase
                      | startswith("application/json")
                    )
                  | not
                )

            # 5. Required fields must exist
            - action: drop
              expression: |
                (.REQUEST.BODY.client? | not) or (.REQUEST.BODY.destination_client? | not) or (.REQUEST.BODY.amount? | not)

            # 6. Amount must be a valid number
            - action: drop
              expression: |
                (.REQUEST.BODY.amount | type != "number" and (type != "string" or test("^[0-9]+(\.[0-9]+)?$") | not))

            # 7. Client usernames must be safe strings
            - action: drop
              expression: |
                ([.REQUEST.BODY.client?, .REQUEST.BODY.destination_client?] | map(
                  select(type == "string" and length >= 3 and length <= 64 and test("^[a-zA-Z0-9._-]+$"))
                ) | length != 2

            # 8. Control characters / binary payloads
            - action: drop
              expression: |
                ([.REQUEST.BODY.client?, .REQUEST.BODY.destination_client?, .REQUEST.BODY.amount?]
                | map(tostring)
                | join(""))
                | test("[\x00-\x08\x0B\x0C\x0E-\x1F]")

            # 9. SQL injection detection
            - action: drop
              expression: |
                ([.REQUEST.BODY.client?, .REQUEST.BODY.destination_client?]
                | map(tostring)
                | join(" "))
                | test("(?i)(union\\s+select|select\\s+.*from|or\\s+1=1|--|;|/\\*)")

            # 10. Template / code injection detection
            - action: drop
              expression: |
                ([.REQUEST.BODY.client?, .REQUEST.BODY.destination_client?]
                | map(tostring)
                | join(" "))
                | test("{{|}}|{%-|-%}|__class__|__mro__|__subclasses__")
        response:
          default-action: accept
          rules:
            # 1. No stack traces or internal errors
            - action: drop
              expression: |
                  .RESPONSE.BODY.error?
                  | type == "string"
                  and test("(?i)(stacktrace|exception|traceback|sql|directus)")

            # 2. Validate response structure
            - action: drop
              expression: |
                (.RESPONSE.BODY.message? | not) or (.RESPONSE.BODY.from? | not) or (.RESPONSE.BODY.to? | not) or (.RESPONSE.BODY["do-transaction"]? | not)
  - name: transaction
    type: custom
    operation: knative:services.v1.serving.knative.dev/transaction?method=POST
    metadata:
      firewall:
        request:
          default-action: accept
          rules:
            # 1. Drop if method is not POST
            - action: drop
              expression: |
                  .REQUEST.METHOD
                  | ascii_upcase
                  | . != "POST"

            # 2. Drop if path is not exactly /
            - action: drop
              expression: |
                  .REQUEST.URI.path != "/"

            # 3. Drop if query string is present
            - action: drop
              expression: |
                .REQUEST.URI.query | length > 0

            # 4. Drop if Content-Type is not application/json
            - action: drop
              expression: |
                (
                  .REQUEST.HEADERS["Content-Type"] // []
                  | any(
                      ascii_downcase
                      | startswith("application/json")
                    )
                  | not
                )

            # 5. Required fields must exist
            - action: drop
              expression: |
                (.REQUEST.BODY.from? | not) or (.REQUEST.BODY.to? | not) or (.REQUEST.BODY.amount? | not)

            # 6. Amount must be a valid number
            - action: drop
              expression: |
                (.REQUEST.BODY.amount | type != "number" and (type != "string" or test("^[0-9]+(\.[0-9]+)?$") | not))

            # 7. IDs must be valid
            - action: drop
              expression: |
                ([.REQUEST.BODY.from?, .REQUEST.BODY.to?] | map(
                  select(type == "string" and length >= 1 and test("^[a-zA-Z0-9-]+$"))
                ) | length != 2

            # 8. Control characters / binary payloads
            - action: drop
              expression: |
                ([.REQUEST.BODY.from?, .REQUEST.BODY.to?, .REQUEST.BODY.amount?]
                | map(tostring)
                | join(""))
                | test("[\x00-\x08\x0B\x0C\x0E-\x1F]")

            # 9. SQL injection detection
            - action: drop
              expression: |
                ([.REQUEST.BODY.from?, .REQUEST.BODY.to?]
                | map(tostring)
                | join(" "))
                | test("(?i)(union\\s+select|select\\s+.*from|or\\s+1=1|--|;|/\\*)")

            # 10. Template / code injection detection
            - action: drop
              expression: |
                ([.REQUEST.BODY.from?, .REQUEST.BODY.to?]
                | map(tostring)
                | join(" "))
                | test("{{|}}|{%-|-%}|__class__|__mro__|__subclasses__")
        response:
          default-action: accept
          rules:
            # 1. No stack traces or internal errors
            - action: drop
              expression: |
                  .RESPONSE.BODY.error?
                  | type == "string"
                  and test("(?i)(stacktrace|exception|traceback|sql|directus)")

            # 2. Validate response structure
            - action: drop
              expression: |
                (.RESPONSE.BODY.message? | not) or (.RESPONSE.BODY.success? | not)
  - name: result
    type: custom
    operation: knative:services.v1.serving.knative.dev/result?method=POST
    metadata:
      firewall:
        request:
          default-action: accept
          rules:
            # 1. Drop if method is not POST or GET
            - action: drop
              expression: |
                  (.REQUEST.METHOD
                  | ascii_upcase
                  | . != "POST" and . != "GET")

            # 2. Drop if path is not exactly /
            - action: drop
              expression: |
                  .REQUEST.URI.path != "/"

            # 3. Drop if Content-Type is not application/json (for POST only)
            - action: drop
              expression: |
                  (.REQUEST.METHOD
                  | ascii_upcase
                  | . == "POST") and
                  (
                    .REQUEST.HEADERS["Content-Type"] // []
                    | any(
                        ascii_downcase
                        | startswith("application/json")
                      )
                    | not
                  )

            # 4. Control characters / binary payloads
            - action: drop
              expression: |
                  (.REQUEST.BODY?
                  | tostring
                  | test("[\x00-\x08\x0B\x0C\x0E-\x1F]"))

            # 5. SQL injection detection
            - action: drop
              expression: |
                  (.REQUEST.BODY?
                  | tostring
                  | test("(?i)(union\\s+select|select\\s+.*from|or\\s+1=1|--|;|/\\*)"))

            # 6. Template / code injection detection
            - action: drop
              expression: |
                  (.REQUEST.BODY?
                  | tostring
                  | test("{{|}}|{%-|-%}|__class__|__mro__|__subclasses__"))
        response:
          default-action: accept
          rules:
            # 1. No stack traces or internal errors
            - action: drop
              expression: |
                  .RESPONSE.BODY.error?
                  | type == "string"
                  and test("(?i)(stacktrace|exception|traceback|sql|directus)")

            # 2. Validate response structure
            - action: drop
              expression: |
                (.RESPONSE.BODY.message? | not)
  - name: process-event
    type: expression
    operation: |
      {
        transformed: (
          (
            .headers
            | to_entries
            | map(select(.key | ascii_downcase != "host"))
            | map({("HEADER_" + .key): .value})
            | add
          ) + .data
        )
      }

states:
  - name: entry-event
    type: event
    onEvents:
      - eventRefs:
          - triggerEvent
        actions:
        - functionRef:
            refName: process-event
    stateDataFilter:
      output: "${ .transformed }"
    transition: authorization

  - name: authorization
    type: operation
    actions:
      - functionRef:
          refName: authorization
        actionDataFilter:
          toStateData: ._result
    stateDataFilter:
      output: ._result
    # stateDataFilter:
    #   output: |
    #     ${
    #       (
    #         $WORKFLOW.responseHeaders
    #         | to_entries
    #         | map({("HEADER_" + .key): .value})
    #         | add
    #       ) + .
    #     }
    transition: authorization-decide

  - name: authorization-decide
    type: switch
    dataConditions:
      - condition: ${ ."do-verification" == true }
        transition: verify-transaction
      # - condition: "${ .do-verification == false or .STATUS_CODE != null and (.STATUS_CODE < 200 or .STATUS_CODE >= 300) }"
      #   transition: result
    defaultCondition:
      # end: true
      transition: result

  - name: verify-transaction
    type: operation
    actions:
      - functionRef:
          refName: verify-transaction
        actionDataFilter:
          toStateData: ._result
    stateDataFilter:
      output: ._result
    # stateDataFilter:
    #   output: |
    #     ${
    #       (
    #         $WORKFLOW.responseHeaders
    #         | to_entries
    #         | map({("HEADER_" + .key): .value})
    #         | add
    #       ) + .
    #     }
    transition: verify-transaction-decide

  - name: verify-transaction-decide
    type: switch
    dataConditions:
      - condition: ${ ."do-transaction" == true }
        transition: transaction
      # - condition: "${ .do-transaction == false or .STATUS_CODE != null and (.STATUS_CODE < 200 or .STATUS_CODE >= 300) }"
      #   transition: result
    defaultCondition:
      # end: true
      transition: result

  - name: transaction
    type: operation
    actions:
      - functionRef:
          refName: transaction
        actionDataFilter:
          toStateData: ._result
    stateDataFilter:
      output: ._result
    # stateDataFilter:
    #   output: |
    #     ${
    #       (
    #         $WORKFLOW.responseHeaders
    #         | to_entries
    #         | map({("HEADER_" + .key): .value})
    #         | add
    #       ) + .
    #     }
    transition: result
  
  - name: result
    type: operation
    actions:
      - functionRef:
          refName: result
    end: true
