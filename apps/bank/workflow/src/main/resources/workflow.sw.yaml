states:
  - name: entry-event
    type: event
    onEvents:
      - eventRefs:
          - triggerEvent
        actions:
        - functionRef:
            refName: process-event
    stateDataFilter:
      output: "${ .transformed }"
    transition: authorization

  - name: authorization
    type: operation
    actions:
      - functionRef:
          refName: authorization
        actionDataFilter:
          toStateData: ._result
    stateDataFilter:
      output: ._result
    # stateDataFilter:
    #   output: |
    #     ${
    #       (
    #         $WORKFLOW.responseHeaders
    #         | to_entries
    #         | map({("HEADER_" + .key): .value})
    #         | add
    #       ) + .
    #     }
    transition: authorization-decide

  - name: authorization-decide
    type: switch
    dataConditions:
      - condition: ${ ."do-verification" == true }
        transition: verify-transaction
      # - condition: "${ .do-verification == false or .STATUS_CODE != null and (.STATUS_CODE < 200 or .STATUS_CODE >= 300) }"
      #   transition: result
    defaultCondition:
      # end: true
      transition: result

  - name: verify-transaction
    type: operation
    actions:
      - functionRef:
          refName: verify-transaction
        actionDataFilter:
          toStateData: ._result
    stateDataFilter:
      output: ._result
    # stateDataFilter:
    #   output: |
    #     ${
    #       (
    #         $WORKFLOW.responseHeaders
    #         | to_entries
    #         | map({("HEADER_" + .key): .value})
    #         | add
    #       ) + .
    #     }
    transition: verify-transaction-decide

  - name: verify-transaction-decide
    type: switch
    dataConditions:
      - condition: ${ ."do-transaction" == true }
        transition: transaction
      # - condition: "${ .do-transaction == false or .STATUS_CODE != null and (.STATUS_CODE < 200 or .STATUS_CODE >= 300) }"
      #   transition: result
    defaultCondition:
      # end: true
      transition: result

  - name: transaction
    type: operation
    actions:
      - functionRef:
          refName: transaction
        actionDataFilter:
          toStateData: ._result
    stateDataFilter:
      output: ._result
    # stateDataFilter:
    #   output: |
    #     ${
    #       (
    #         $WORKFLOW.responseHeaders
    #         | to_entries
    #         | map({("HEADER_" + .key): .value})
    #         | add
    #       ) + .
    #     }
    transition: result
  
  - name: result
    type: operation
    actions:
      - functionRef:
          refName: result
    end: true
