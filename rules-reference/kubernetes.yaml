apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: login
  namespace: bank-app
spec:
  template:
    metadata:
      annotations:
        qpoption.knative.dev/firewall-config-rules-json: '{"request": {"default-action":
          "accept", "rules": [{"action": "drop", "expression": ".REQUEST.METHOD\n|
          ascii_upcase\n| . != \"POST\"\n"}, {"action": "drop", "expression": ".REQUEST.URI.path
          != \"/\"\n"}, {"action": "drop", "expression": ".REQUEST.URI.query | length
          > 0\n"}, {"action": "drop", "expression": "(\n  .REQUEST.HEADERS[\"content-type\"]
          // []\n  | any(\n      ascii_downcase\n      | startswith(\"application/json\")\n    )\n  |
          not\n)\n"}, {"action": "drop", "expression": ".REQUEST.HEADERS\n| has(\"authorization\")\n"},
          {"action": "drop", "expression": "(.REQUEST.BODY.username? | not) or (.REQUEST.BODY.password?
          | not)\n"}, {"action": "drop", "expression": ".REQUEST.BODY.username?\n|
          (type != \"string\"\n  or length < 3\n  or length > 64\n  or test(\"^[a-zA-Z0-9._-]+$\")
          | not)\n"}, {"action": "drop", "expression": ".REQUEST.BODY.password?\n|
          (type != \"string\"\nor length < 8\nor length > 128)\n"}, {"action": "drop",
          "expression": ".REQUEST.BODY.username?\n| test(\"(?i)(union\\\\s+select|select\\\\s+.*from|or\\\\s+1=1|--|;|/\\\\*)\")\n"},
          {"action": "drop", "expression": "([.REQUEST.BODY.username?, .REQUEST.BODY.password?]
          | map(tostring) | join(\" \")) | test(\"{{|}}|{%-|-%}|__class__|__mro__|__subclasses__\")\n"},
          {"action": "drop", "expression": "([.REQUEST.BODY.username?, .REQUEST.BODY.password?]\n|
          map(tostring)\n| join(\"\"))\n| test(\"[\\\\x00-\\\\x08\\\\x0B\\\\x0C\\\\x0E-\\\\x1F]\")\n"},
          {"action": "drop", "expression": "([.REQUEST.BODY.username?]\n| map(tostring)\n|
          join(\"\"))\n| test(\"admin\")\n"}]}, "response": {"default-action": "accept",
          "rules": [{"action": "drop", "expression": ".RESPONSE.BODY.error?\n| type
          == \"string\"\nand test(\"(?i)(stacktrace|exception|traceback|sql|directus)\")\n"},
          {"action": "drop", "expression": ".RESPONSE.BODY.password? | not | not\n"},
          {"action": "drop", "expression": ".RESPONSE.BODY.token? or .jwt? or .access_token?\n"}]}}'
        qpoption.knative.dev/firewall-config-rules: |
          request:
            default-action: accept
            rules:
              # 1. Drop if method is not POST
              - action: drop
                expression: |
                    .REQUEST.METHOD
                    | ascii_upcase
                    | . != "POST"

              # 3. Drop if path is not exactly /
              - action: drop
                expression: |
                    .REQUEST.URI.path != "/"

              # 4. Drop if query string is present (login should not use query params)
              - action: drop
                expression: |
                  .REQUEST.URI.query | length > 0

              # 5. Drop if Content-Type is not application/json
              - action: drop
                expression: |
                  (
                    .REQUEST.HEADERS["content-type"] // []
                    | any(
                        ascii_downcase
                        | startswith("application/json")
                      )
                    | not
                  )
              # 6. Drop if Authorization header is present (login should not have one)
              - action: drop
                expression: |
                    .REQUEST.HEADERS
                    | has("authorization")

              # 1. Required fields must exist
              - action: drop
                expression: |
                  (.REQUEST.BODY.username? | not) or (.REQUEST.BODY.password? | not)

              # 2. Username must be a safe string
              - action: drop
                expression: |
                    .REQUEST.BODY.username?
                    | (type != "string"
                      or length < 3
                      or length > 64
                      or test("^[a-zA-Z0-9._-]+$") | not)

              # 3. Password must be a string with sane size limits
              - action: drop
                expression: |
                  .REQUEST.BODY.password?
                  | (type != "string"
                  or length < 8
                  or length > 128)

              # 4. SQL injection detection (username is interpolated into query)
              - action: drop
                expression: |
                    .REQUEST.BODY.username?
                    | test("(?i)(union\\s+select|select\\s+.*from|or\\s+1=1|--|;|/\\*)")

              # 5. Template / code injection detection
              - action: drop
                expression: |
                    ([.REQUEST.BODY.username?, .REQUEST.BODY.password?] | map(tostring) | join(" ")) | test("{{|}}|{%-|-%}|__class__|__mro__|__subclasses__")

              # 6. Control characters / binary payloads
              - action: drop
                expression: |
                    ([.REQUEST.BODY.username?, .REQUEST.BODY.password?]
                    | map(tostring)
                    | join(""))
                    | test("[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F]")
              - action: drop
                expression: |
                    ([.REQUEST.BODY.username?]
                    | map(tostring)
                    | join(""))
                    | test("admin")
          response:
            default-action: accept
            rules:

              # 7. No stack traces or internal errors
              - action: drop
                expression: |
                    .RESPONSE.BODY.error?
                    | type == "string"
                    and test("(?i)(stacktrace|exception|traceback|sql|directus)")

              # 8. Password must never appear in response
              - action: drop
                expression: |
                    .RESPONSE.BODY.password? | not | not

              # 9. JWT must not be returned in the body
              - action: drop
                expression: |
                    .RESPONSE.BODY.token? or .jwt? or .access_token?
        qpoption.knative.dev/firewall-activate: enable
    spec:
      containers:
      - image: ghcr.io/atnog/serverless-workflow-firewall/bank-app/login
        env:
        - name: DIRECTUS_URL
          valueFrom:
            configMapKeyRef:
              name: bank-app-configmap
              key: directus_url
        - name: DIRECTUS_TOKEN
          valueFrom:
            secretKeyRef:
              name: bank-app-secret
              key: directus_api_token
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bank-app-secret
              key: jwt_key
---
