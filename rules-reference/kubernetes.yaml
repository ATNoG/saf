apiVersion: v1
kind: Secret
metadata:
  name: bank-app-secret
  namespace: bank-app
type: Opaque
data:
  directus_api_token: R1R1UFJjX1lXazctdmZrRkZzUlBEcENTU1NfY3BseVY=
  jwt_key: dmVyeV9zZWNyZXRfa2V5
  otp_secret: MTIzNDU2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-app-configmap
  namespace: bank-app
data:
  directus_url: http://directus.directus:8055
  max_amount: '1000'
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: entry-point
  namespace: bank-app
spec:
  template:
    metadata:
      annotations:
        qpoption.knative.dev/flow-activate: enable
    spec:
      containers:
      - image: ghcr.io/atnog/knative-workflow-apps-kit/bank-app/entry-point
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: login
  namespace: bank-app
spec:
  template:
    metadata:
      annotations:
        qpoption.knative.dev/flow-activate: enable
    spec:
      containers:
      - image: ghcr.io/atnog/knative-workflow-apps-kit/bank-app/login
        env:
        - name: DIRECTUS_URL
          valueFrom:
            configMapKeyRef:
              name: bank-app-configmap
              key: directus_url
        - name: DIRECTUS_TOKEN
          valueFrom:
            secretKeyRef:
              name: bank-app-secret
              key: directus_api_token
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bank-app-secret
              key: jwt_key
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: authorization
  namespace: bank-app
spec:
  template:
    spec:
      containers:
      - image: ghcr.io/atnog/knative-workflow-apps-kit/bank-app/authorization
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bank-app-secret
              key: jwt_key
    metadata:
      annotations:
        qpoption.knative.dev/qpoption.knative.dev/firewall-config-rules: '{"request":
          {"default-action": "accept", "rules": [{"body": {"type": "application/json",
          "action": "drop", "expression": ".client? | type == \"string\" | not\n"}},
          {"body": {"type": "application/json", "action": "drop", "expression": ".?\n|
          tostring\n| test(\"(?i)(union\\\\s+select|select\\\\s+.*from|{{|}}|{%-|-%}|__class__|__mro__|__subclasses__)\")\n"}}]},
          "response": {"default-action": "accept", "rules": [{"body": {"type": "application/json",
          "action": "drop", "expression": ".error? | type == \"string\" and test(\"(?i)(stacktrace|exception|traceback)\")\n"}},
          {"body": {"type": "application/json", "action": "drop", "expression": ".message?
          | test(\"Access denied|Invalid token\")\n"}}]}}'
        qpoption.knative.dev/qpoption.knative.dev/firewall-activate: enable
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: verify-transaction
  namespace: bank-app
spec:
  template:
    spec:
      containers:
      - image: ghcr.io/atnog/knative-workflow-apps-kit/bank-app/verify-transaction
        env:
        - name: DIRECTUS_URL
          valueFrom:
            configMapKeyRef:
              name: bank-app-configmap
              key: directus_url
        - name: DIRECTUS_TOKEN
          valueFrom:
            secretKeyRef:
              name: bank-app-secret
              key: directus_api_token
        - name: OTP_SECRET
          valueFrom:
            secretKeyRef:
              name: bank-app-secret
              key: otp_secret
        - name: MAX_AMOUNT
          valueFrom:
            configMapKeyRef:
              name: bank-app-configmap
              key: max_amount
    metadata:
      annotations:
        qpoption.knative.dev/qpoption.knative.dev/firewall-config-rules: '{"request":
          {"default-action": "accept", "rules": [{"body": {"type": "application/json",
          "action": "drop", "expression": ".amount?\n| type == \"number\"\nand (.
          >= 0) | not\n"}}, {"body": {"type": "application/json", "action": "drop",
          "expression": ".otp?\n| (type == \"string\") | not\n"}}, {"body": {"type":
          "application/json", "action": "drop", "expression": ".client? | type ==
          \"string\" | not\n"}}, {"body": {"type": "application/json", "action": "drop",
          "expression": ".destination_client? | type == \"string\" | not\n"}}]}, "response":
          {"default-action": "accept", "rules": [{"body": {"type": "application/json",
          "action": "drop", "expression": ".error? | type == \"string\" and test(\"(?i)(stacktrace|exception|traceback)\")\n"}},
          {"body": {"type": "application/json", "action": "drop", "expression": ".amount?
          | type == \"number\" and (. < 0)\n"}}]}}'
        qpoption.knative.dev/qpoption.knative.dev/firewall-activate: enable
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: transaction
  namespace: bank-app
spec:
  template:
    spec:
      containers:
      - image: ghcr.io/atnog/knative-workflow-apps-kit/bank-app/transaction
        env:
        - name: DIRECTUS_URL
          valueFrom:
            configMapKeyRef:
              name: bank-app-configmap
              key: directus_url
        - name: DIRECTUS_TOKEN
          valueFrom:
            secretKeyRef:
              name: bank-app-secret
              key: directus_api_token
    metadata:
      annotations:
        qpoption.knative.dev/qpoption.knative.dev/firewall-config-rules: '{"request":
          {"default-action": "accept", "rules": [{"body": {"type": "application/json",
          "action": "drop", "expression": ".from? | type == \"string\" | not\n"}},
          {"body": {"type": "application/json", "action": "drop", "expression": ".to?
          | type == \"string\" | not\n"}}, {"body": {"type": "application/json", "action":
          "drop", "expression": ".amount? | type == \"number\" and (. >= 0) | not\n"}},
          {"body": {"type": "application/json", "action": "drop", "expression": ".?
          | tostring | test(\"(?i)(union\\\\s+select|select\\\\s+.*from|{{|}}|{%-|-%}|__class__|__mro__|__subclasses__|eval\\\\(|document\\\\.cookie)\")
          \n"}}]}, "response": {"default-action": "accept", "rules": [{"body": {"type":
          "application/json", "action": "drop", "expression": ".error? | type == \"string\"
          and test(\"(?i)(stacktrace|exception|traceback)\")\n"}}]}}'
        qpoption.knative.dev/qpoption.knative.dev/firewall-activate: enable
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: result
  namespace: bank-app
spec:
  template:
    spec:
      containers:
      - image: ghcr.io/atnog/knative-workflow-apps-kit/bank-app/result
    metadata:
      annotations:
        qpoption.knative.dev/qpoption.knative.dev/firewall-config-rules: '{"request":
          {"default-action": "accept", "rules": [{"body": {"type": "application/json",
          "action": "drop", "expression": ".error? | type == \"string\" and test(\"(?i)(stacktrace|exception|traceback)\")\n"}}]},
          "response": {"default-action": "accept", "rules": [{"body": {"type": "application/json",
          "action": "drop", "expression": ".error? | type == \"string\" and test(\"(?i)(stacktrace|exception|traceback)\")\n"}}]}}'
        qpoption.knative.dev/qpoption.knative.dev/firewall-activate: enable
---
apiVersion: sources.knative.dev/v1
kind: SinkBinding
metadata:
  generation: 1
  name: bind-entry-point
  namespace: bank-app
spec:
  sink:
    ref:
      apiVersion: eventing.knative.dev/v1
      kind: Broker
      name: broker
      namespace: bank-app
  subject:
    apiVersion: serving.knative.dev/v1
    kind: Service
    name: entry-point
    namespace: bank-app
