apiVersion: v1
kind: Secret
metadata:
  name: bank-app-secret
  namespace: bank-app
type: Opaque
data:
  directus_api_token: Rm5RekxqWE9VaF9FLWZ2VW1NZWhGaGFIMkgxaWhicGw=
  jwt_key: dmVyeV9zZWNyZXRfa2V5
  otp_secret: MTIzNDU2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-app-configmap
  namespace: bank-app
data:
  directus_url: http://directus.directus:8055
  max_amount: '1000'
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: entry-point
  namespace: bank-app
spec:
  template:
    spec:
      containers:
      - image: ghcr.io/atnog/serverless-workflow-firewall/bank-app/entry-point
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: login
  namespace: bank-app
spec:
  template:
    metadata:
      annotations:
        qpoption.knative.dev/flow-activate: enable
        qpoption.knative.dev/firewall-config-rules: '{"request": {"default-action":
          "accept", "rules": [{"action": "drop", "expression": "(.REQUEST.BODY.username?
          | not) or (.REQUEST.BODY.password? | not)\n"}, {"action": "drop", "expression":
          ".REQUEST.BODY.username?\n| (type != \"string\"\n  or length < 3\n  or length
          > 64\n  or test(\"^[a-zA-Z0-9._-]+$\") | not)\n"}, {"action": "drop", "expression":
          ".REQUEST.BODY.password?\n| (type != \"string\"\nor length < 8\nor length
          > 128)\n"}, {"action": "drop", "expression": ".REQUEST.BODY.username?\n|
          test(\"(?i)(union\\\\s+select|select\\\\s+.*from|or\\\\s+1=1|--|;|/\\\\*)\")\n"},
          {"action": "drop", "expression": "([.REQUEST.BODY.username?, .REQUEST.BODY.password?]
          | map(tostring) | join(\" \")) | test(\"{{|}}|{%-|-%}|__class__|__mro__|__subclasses__\")\n"},
          {"action": "drop", "expression": "([.REQUEST.BODY.username?, .REQUEST.BODY.password?]\n|
          map(tostring)\n| join(\"\"))\n| test(\"[\\\\x00-\\\\x08\\\\x0B\\\\x0C\\\\x0E-\\\\x1F]\")\n"},
          {"action": "drop", "expression": "([.REQUEST.BODY.username?]\n| map(tostring)\n|
          join(\"\"))\n| test(\"admin\")\n"}]}, "response": {"default-action": "accept",
          "rules": [{"action": "drop", "expression": ".RESPONSE.BODY.error?\n| type
          == \"string\"\nand test(\"(?i)(stacktrace|exception|traceback|sql|directus)\")\n"},
          {"action": "drop", "expression": ".RESPONSE.BODY.password? | not | not\n"},
          {"action": "drop", "expression": ".RESPONSE.BODY.token? or .jwt? or .access_token?\n"}]}}'
        qpoption.knative.dev/firewall-activate: enable
    spec:
      containers:
      - image: ghcr.io/atnog/serverless-workflow-firewall/bank-app/login
        env:
        - name: DIRECTUS_URL
          valueFrom:
            configMapKeyRef:
              name: bank-app-configmap
              key: directus_url
        - name: DIRECTUS_TOKEN
          valueFrom:
            secretKeyRef:
              name: bank-app-secret
              key: directus_api_token
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bank-app-secret
              key: jwt_key
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: authorization
  namespace: bank-app
spec:
  template:
    spec:
      containers:
      - image: ghcr.io/atnog/serverless-workflow-firewall/bank-app/authorization
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bank-app-secret
              key: jwt_key
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: verify-transaction
  namespace: bank-app
spec:
  template:
    spec:
      containers:
      - image: ghcr.io/atnog/serverless-workflow-firewall/bank-app/verify-transaction
        env:
        - name: DIRECTUS_URL
          valueFrom:
            configMapKeyRef:
              name: bank-app-configmap
              key: directus_url
        - name: DIRECTUS_TOKEN
          valueFrom:
            secretKeyRef:
              name: bank-app-secret
              key: directus_api_token
        - name: OTP_SECRET
          valueFrom:
            secretKeyRef:
              name: bank-app-secret
              key: otp_secret
        - name: MAX_AMOUNT
          valueFrom:
            configMapKeyRef:
              name: bank-app-configmap
              key: max_amount
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: transaction
  namespace: bank-app
spec:
  template:
    spec:
      containers:
      - image: ghcr.io/atnog/serverless-workflow-firewall/bank-app/transaction
        env:
        - name: DIRECTUS_URL
          valueFrom:
            configMapKeyRef:
              name: bank-app-configmap
              key: directus_url
        - name: DIRECTUS_TOKEN
          valueFrom:
            secretKeyRef:
              name: bank-app-secret
              key: directus_api_token
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: result
  namespace: bank-app
spec:
  template:
    spec:
      containers:
      - image: ghcr.io/atnog/serverless-workflow-firewall/bank-app/result
---
apiVersion: sources.knative.dev/v1
kind: SinkBinding
metadata:
  generation: 1
  name: bind-entry-point
  namespace: bank-app
spec:
  sink:
    ref:
      apiVersion: eventing.knative.dev/v1
      kind: Broker
      name: broker
      namespace: bank-app
  subject:
    apiVersion: serving.knative.dev/v1
    kind: Service
    name: entry-point
    namespace: bank-app
