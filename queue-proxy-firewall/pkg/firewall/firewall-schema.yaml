# firewall-schema.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Serverless Workflow Firewall Language"
description: "A minimal workflow firewall language"
type: object
properties:
  request:
    $ref: "#/$defs/rules"
  response:
    $ref: "#/$defs/rules"

$defs:
  rules:
    type: object
    required: [default-action, rules]
    properties:
      default-action:
        type: string
        enum: ["drop", "accept", "reject"]
      rules:
        type: array
        items:
          type: object
          # required: [type, action, expression]
          properties:
            action:
              type: string
              enum: ["drop", "accept", "reject", "log"]
            expression:
              type: string       #for json bodies, the expression will be a jq expression that must be evaluated to true or false (if true, it will trigger the defined actions)
          allOf:
            # Case 1: schema is present → only type + action required
            - if:
                required: [schema]
              then:
                required: [type, action, expression]
                properties:
                  schema:
                    type: object
                    required: [type, path]
                    properties:
                      type:
                        type: string
                        enum: [json, yaml]      # wether the schema is a json or yaml schema
                      path:
                        type: string            # the path to the schema file
              else:
                # Case 2: schema is NOT present → expression is required
                required: [action, expression]

additionalProperties: false
